name: Build Moja Zdravica (zdravica.rs)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nutra-staging-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Test, build and publish gh-pages (zdravica.rs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Cache catalog product images (user-supplied links)
        run: python3 scripts/cache-catalog-images.py

      - name: Convert cached product images to WebP
        run: node scripts/catalog-images-webp.mjs


      - name: Generate static site for https://zdravica.rs
        # Sajt je na korenu domena, pa se koriste obične apsolutne putanje (čisti URL-ovi za Google).
        run: npm run build:site
        env:
          PUBLIC_SITE_ENV: production
          PUBLIC_STATIC_PREVIEW: 'true'
          PUBLIC_MARKET: RS
          SITE_URL: https://zdravica.rs
          ORDER_MODE: test
          # Forma šalje porudžbine na API na serveru (deploy/setup-zdravica.sh, servis nutra-orders).
          # Da li porudžbina zaista ide u MonadLead odlučuje ORDER_MODE u /etc/nutra/backend.env na serveru.
          PUBLIC_ORDER_ENDPOINT: https://zdravica.rs/api/order/
          PUBLIC_CATALOG_ORDER_SUBMISSIONS: 'true'

      - name: Check build output
        run: |
          test -s preview-dist/index.html
          test -s preview-dist/robots.txt
          test -s preview-dist/sitemap.xml
          # produkcija: bez noindex, canonical i sitemap na zdravica.rs
          ! grep -qi 'name="robots" content="noindex' preview-dist/index.html
          grep -q '<link rel="canonical" href="https://zdravica.rs/"' preview-dist/index.html
          grep -q 'Sitemap: https://zdravica.rs/sitemap.xml' preview-dist/robots.txt
          grep -q '<loc>https://zdravica.rs/' preview-dist/sitemap.xml
          touch preview-dist/.nojekyll

      - name: Publish built files to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./preview-dist
          publish_branch: gh-pages
          keep_files: false
