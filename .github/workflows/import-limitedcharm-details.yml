name: Import Limited Charm composition and reviews

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-limitedcharm-details.yml
      - scripts/import-limitedcharm-details.py
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: import-limitedcharm-details
  cancel-in-progress: false

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Nutra
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install parser
        run: python3 -m pip install --quiet beautifulsoup4

      - name: Fetch composition, ratings, comments and ingredient images
        run: python3 scripts/import-limitedcharm-details.py

      - name: Commit imported data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/limitedcharm-details.json public/images/sastav
          if git diff --cached --quiet; then
            echo "No changes in imported data."
          else
            git commit -m "Import composition and comments from Limited Charm product pages"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Trigger staging build for GitHub token commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run nutra-staging.yml --ref main
