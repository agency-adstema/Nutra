# Add INSIDE the existing HTTPS server {} block for lamena.io in nginx.
# Do not replace the existing server, location /, SSL, /astro or other routes.
# The static files come from deploy/deploy-nutra-preview.sh.

location = /nutra {
    return 308 /nutra/;
}

location ^~ /nutra/ {
    alias /var/www/nutra-preview/;
    index index.html;
    try_files $uri $uri/ =404;

    # Demo/staging should NOT be indexed, even if meta robots are missing.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Preview ONLY. Real order submissions must be handled by an Astro server.
    limit_except GET HEAD { deny all; }
}
