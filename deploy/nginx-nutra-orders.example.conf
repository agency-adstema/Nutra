# Add to the EXISTING HTTPS server {} block for lamena.io.
# Do not replace the existing /nutra/ static alias or other lamena.io routes.
# Exact match wins over the existing "location ^~ /nutra/" static preview.
location = /nutra/api/order {
    return 308 /nutra/api/order/;
}

location = /nutra/api/order/ {
    limit_except POST { deny all; }
    client_max_body_size 12k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:4376/api/order/;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    add_header Cache-Control "no-store" always;
}
